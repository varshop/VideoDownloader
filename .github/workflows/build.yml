name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check project structure
        run: |
          missing=0
          for f in settings.gradle.kts build.gradle.kts gradle.properties \
                   app/build.gradle.kts app/src/main/AndroidManifest.xml \
                   app/src/main/res/values/strings.xml \
                   app/src/main/res/drawable/ic_launcher_foreground.xml \
                   app/src/main/res/mipmap-anydpi/ic_launcher.xml \
                   app/src/main/java/com/example/videodl/App.kt \
                   app/src/main/java/com/example/videodl/MainActivity.kt \
                   app/src/main/java/com/example/videodl/MainViewModel.kt \
                   app/src/main/java/com/example/videodl/Models.kt \
                   app/src/main/java/com/example/videodl/Ytdlp.kt \
                   app/src/main/java/com/example/videodl/Downloader.kt \
                   app/src/main/java/com/example/videodl/DownloadService.kt \
                   app/src/main/java/com/example/videodl/Notifs.kt \
                   app/src/main/java/com/example/videodl/Theme.kt; do
            if [ ! -f "$f" ]; then echo "::error::ملف ناقص أو في مكان خاطئ: $f"; missing=1; fi
          done
          echo "الملفات الموجودة فعلياً:"; find . -path ./.git -prune -o -type f -print | sort
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Videodownloader-APK
          path: app/build/outputs/apk/release/*.apk
